# Base configuration — shared across all profiles.
# Profile-specific overrides live in application-local.yml / application-test.yml.
# @project.version@ is filtered in at build time (see pom.xml) so the reported version is real.

spring:
  application:
    name: agentic-ai-task-orchestrator
  profiles:
    default: local

  # --- Persistence (introduced in M2 for the security domain) ---
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate never generates or mutates DDL.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

  # --- Redis (M7): ephemeral, bounded, TTL'd agent conversation memory (docs/MEMORY.md).
  #     Never durable domain data. Short connect/command timeout so a Redis outage degrades fast
  #     (new conversations run stateless) instead of hanging the request thread. ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s

  # --- Spring AI / Ollama (M4). Local-first: no user data leaves the machine (DATA_PRIVACY.md). ---
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      # Never auto-download a model at startup; a missing model surfaces as a request-time error,
      # not a silent multi-GB pull. This also lets the app boot while Ollama is stopped.
      init:
        pull-model-strategy: never
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2}
          temperature: ${OLLAMA_TEMPERATURE:0.2}
    # Conservative retry of transient provider failures only; never retry 4xx/validation.
    retry:
      max-attempts: 2
      on-client-errors: false

app:
  version: @project.version@

# --- Agent conversation memory bounds (M7). Sliding TTL; two boundaries: storage (what Redis keeps)
#     and context (the smaller slice rendered into the LLM prompt). See docs/MEMORY.md. ---
agent:
  memory:
    ttl-seconds: ${AGENT_MEMORY_TTL_SECONDS:86400}
    max-messages: ${AGENT_MEMORY_MAX_MESSAGES:50}
    max-chars: ${AGENT_MEMORY_MAX_CHARS:12000}
    context-max-messages: ${AGENT_MEMORY_CONTEXT_MAX_MESSAGES:12}
    context-max-chars: ${AGENT_MEMORY_CONTEXT_MAX_CHARS:6000}

# --- Guardrails (M8): backend-authoritative enforcement on top of the M5 tool/risk metadata and the
#     M6 cooperative bounds. Confirmation state + per-user rate window live in Redis (separate
#     namespaces from conversation memory). See docs/GUARDRAILS.md. ---
guardrail:
  confirmation-ttl-seconds: ${AGENT_CONFIRMATION_TTL_SECONDS:300}
  user-tool-budget-per-min: ${AGENT_USER_TOOL_BUDGET_PER_MIN:60}
  max-argument-chars: ${AGENT_MAX_ARGUMENT_CHARS:4000}

# --- Durable agent audit (M9): PostgreSQL execution history. Retention is now enforced by the
#     scheduled AuditRetentionJob (M10, ADR-0031). Summaries are length-capped (redacted).
#     See docs/AUDIT_LOGGING.md, docs/OBSERVABILITY.md. ---
audit:
  retention-days: ${AGENT_AUDIT_RETENTION_DAYS:90}
  final-summary-max-chars: ${AGENT_AUDIT_FINAL_SUMMARY_MAX_CHARS:500}
  result-summary-max-chars: ${AGENT_AUDIT_RESULT_SUMMARY_MAX_CHARS:500}
  # --- Audit retention purge (M10): parent-first batched DELETE on agent_executions with
  #     cascading FK cleanup of steps + tool_executions. Best-effort, single-node overlap-safe.
  #     Disabled in `test` profile so CI stays deterministic. UTC cron. See ADR-0031. ---
  purge:
    enabled: ${AGENT_AUDIT_PURGE_ENABLED:true}
    cron: ${AGENT_AUDIT_PURGE_CRON:0 15 3 * * *}
    batch-size: ${AGENT_AUDIT_PURGE_BATCH_SIZE:500}
    max-batches: ${AGENT_AUDIT_PURGE_MAX_BATCHES:100}

# --- LLM layer (the app's own keys, kept independent of the spring.ai.* auto-config keys). ---
llm:
  provider: ${LLM_PROVIDER:ollama}          # ollama (only wired provider in M4; openai is future/not wired)
  request-timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:60}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.2}
    temperature: ${OLLAMA_TEMPERATURE:0.2}

# --- Security (JWT / CORS). Secrets come from the environment; never commit real values. ---
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    issuer: agentic-ai-task-orchestrator
  cors:
    # Comma-separated list of allowed origins (the frontend origin[s]). Never a wildcard with credentials.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: 8080

# Actuator: expose health, info, prometheus (M10). Health details hidden by default (no dependency
# internals leaked); local dev turns them on (see application-local.yml). Kubernetes-style liveness /
# readiness probes are enabled; the `readiness` group intentionally includes ONLY `db` — Redis
# (M7 memory degrades to stateless) and Ollama (LLM failures are per-request) do NOT gate readiness.
# See ADR-0030 and docs/OBSERVABILITY.md.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: db
    prometheus:
      access: read_only
  info:
    env:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: ${spring.application.name}
    version: @project.version@
    description: Agentic AI Task Orchestrator backend (Milestone 1 — Backend Foundation).

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  # M10 (ADR-0030): render requestId + executionId from MDC when present, so an operator can pivot
  # request -> agent execution -> audit row from the console. Bracketed placeholders render empty
  # when the MDC key is unset (e.g. non-agent requests, background tasks).
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] [%X{executionId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.prince.agentic: INFO
    # Spring Security at INFO; raise locally for debugging (application-local.yml).
    org.springframework.security: INFO
